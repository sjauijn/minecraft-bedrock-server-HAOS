name: "Minecraft Bedrock Server"
description: "Run your own Minecraft Bedrock Server directly inside Home Assistant"
version: "2026.8.2"
slug: "minecraft_bedrock_server"
url: https://github.com/sjauijn/minecraft-bedrock-server-HAOS/
apparmor: true
init: false
startup: application
ingress: true
ingress_port: 8789
panel_icon: mdi:minecraft
panel_title: "Minecraft Bedrock"
host_network: true
arch:
  - amd64
map:
  - share:rw
  - addon_config:rw
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  install_upgrade_server: bool?
  allow_downgrade: bool?
options:
  install_upgrade_server: true
  allow_downgrade: false
